- main [ref=e2]:
  - paragraph [ref=e3]: PanSphaira · Designkatalog · Stand 2026-11-09 · main 79df9fd
  - 'heading "Drei tragfähige Templates, ein geistiges Eigentum: das Plugin-Prinzip." [level=1] [ref=e4]': "Drei tragfähige Templates,ein geistiges Eigentum: das Plugin-Prinzip."
  - paragraph [ref=e5]: "Alle drei Templates zeigen denselben PsAI-Workspace: Shell mit Domänen-Navigation, Module (Plugins) als eigene Gruppe, Genehmigungs-Warteschlange als Herzstück, Quittungen/Readback als rechte Spur und die Sicherheitsgrenze, die man immer sieht. Der Inhalt ist aus dem Bestand (Modulnamen, Vorgangsvokabular); die Templates ergänzen die bestehende v1-UI, sie ersetzen nichts. Jedes Template gibt es jetzt zweimal: V1 als ruhendes Mockup und V2 mit bedienbarem Genehmigungsfluss (Klick, j/k, g↵/gx, Undo), erweitertem Feedback und eigenem Verbesserungskonzept — nachlesbar in KONZEPT-V2.md."
