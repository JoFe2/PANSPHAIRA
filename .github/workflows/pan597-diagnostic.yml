name: PAN597 diagnostic whole native entry

on:
  push:
    branches:
      - diagnostic/pan597-442-native-loop

permissions:
  contents: read

jobs:
  native-diagnostic:
    name: Supplemental pinned 442 native entry (${{ matrix.mode }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [proof-child, late-native-warm]
    env:
      PAN597_EXECUTION_MODE: ${{ matrix.mode }}
      DIAGNOSTIC_WORKFLOW_SHA: ${{ github.sha }}
      PAN597_PAYLOAD_SHA: 442c168acd2c1f6905f1da3589bacd4f613ed83f
    steps:
      - name: Check out exact unchanged diagnostic payload, not workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 442c168acd2c1f6905f1da3589bacd4f613ed83f
          fetch-depth: 0

      - name: Bind workflow and payload identities separately
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PAN597_PAYLOAD_SHA"
          test "$(git rev-parse HEAD^{tree})" = 0d3e8e381b01488d26d878105532c382704f4008
          printf 'DIAGNOSTIC_WORKFLOW_SHA=%s\nPAN597_PAYLOAD_SHA=%s\n' "$DIAGNOSTIC_WORKFLOW_SHA" "$PAN597_PAYLOAD_SHA"
          printf '%s  %s\n' 1ee9465b311e2129c1da69905c2ede9d95b8b6835a7f281047f40aea6a526b90 scripts/run-pan597-native-surface-tests.mjs | sha256sum --check -
          printf '%s  %s\n' a1a9c3347bd67d5466ab453d479a8b67da6b5bfb07c044388d1a60241af6b9f5 tests/pan597/browser-pairing.test.mjs | sha256sum --check -
          sha256sum --check SHA256SUMS
          printf '%s\n' 'Supplemental reproduction only: no full-suite, release or merge approval.' >> "$GITHUB_STEP_SUMMARY"

      - name: Set up exact existing Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Set up supported npm on ephemeral hosted runner
        run: npm install --global npm@11.16.0

      - name: Install unchanged locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Set up supported Docker Compose
        env:
          CM_COMPOSE_URL: https://github.com/docker/compose/releases/download/v2.40.3/docker-compose-linux-x86_64
          CM_COMPOSE_SHA256: dba9d98e1ba5bfe11d88c99b9bd32fc4a0624a30fafe68eea34d61a3e42fd372
        run: |
          compose_root="$RUNNER_TEMP/chimpmaera-docker-config"
          plugin_dir="$compose_root/cli-plugins"
          compose_binary="$plugin_dir/docker-compose"
          mkdir -p "$plugin_dir"
          curl --fail --location --silent --show-error \
            --output "$compose_binary" "$CM_COMPOSE_URL"
          printf '%s  %s\n' "$CM_COMPOSE_SHA256" "$compose_binary" \
            | sha256sum --check -
          chmod 0755 "$compose_binary"
          printf 'DOCKER_CONFIG=%s\n' "$compose_root" >> "$GITHUB_ENV"
          test "v$(DOCKER_CONFIG="$compose_root" docker compose version --short)" = v2.40.3

      - name: Prepare embedded PostgreSQL runtime
        run: |
          npm rebuild @embedded-postgres/linux-x64
          node_modules/@embedded-postgres/linux-x64/native/bin/initdb --version
          node_modules/@embedded-postgres/linux-x64/native/bin/postgres --version

      - name: Prepare the exact public PAN454 synthetic runtime image
        # Image acquisition is outside the NETWORK_NONE execution window.
        # Never substitute a floating tag or broaden workload permissions.
        run: docker pull --platform linux/amd64 node@sha256:3638d9a6fe4030bd716be989438248074489337ba3275657f93595428be4fc03

      - name: Fetch the pinned public PAN692 KS code without credentials
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          ks_root="$RUNNER_TEMP/pan692-ks"
          git init "$ks_root"
          git -C "$ks_root" -c credential.helper= fetch --depth=1 https://github.com/JoFe2/KaleidoSphere.git 5550c603b005c9c168f39f4047b1b46d2c076409
          git -C "$ks_root" checkout --detach FETCH_HEAD
          test "$(git -C "$ks_root" rev-parse --verify HEAD)" = '5550c603b005c9c168f39f4047b1b46d2c076409'
          test "$(git -C "$ks_root" status --porcelain=v1 --untracked-files=no)" = ''
          sha256sum "$ks_root/services/bi-control/src/business-bi/procurement-analysis.mjs" \
            | grep -q '^7eb01232c7ae93f42e9fa390f20acae26e543b6f0970a1b31567acfc3b957cf6  '
          printf 'KS692_KS_SOURCE=%s\n' "$ks_root" >> "$GITHUB_ENV"

      - name: Prepare exact private PAN527 browser and NSS tooling
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pan527-browsers
          PAN527_NSS_URL: https://snapshot.ubuntu.com/ubuntu/20261022T080000Z/pool/main/n/nss/libnss3-tools_3.98-1ubuntu0.2_amd64.deb
          PAN527_NSS_SHA256: e5b42390b02c21851bc04e9557ec48539a913f9b09637220c4b1db0d1386b3fb
        run: |
          tooling="$RUNNER_TEMP/pan527-nss"
          install -d -m 700 "$tooling"
          curl --fail --location --silent --show-error \
            --output "$tooling/nss.deb" "$PAN527_NSS_URL"
          printf '%s  %s\n' "$PAN527_NSS_SHA256" "$tooling/nss.deb" \
            | sha256sum --check -
          dpkg-deb -x "$tooling/nss.deb" "$tooling/extracted"
          test -x "$tooling/extracted/usr/bin/certutil"
          node node_modules/playwright/cli.js install chromium
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          printf 'PAN527_CERTUTIL=%s\n' "$tooling/extracted/usr/bin/certutil" >> "$GITHUB_ENV"

      - name: Record actual diagnostic runtime
        run: |
          node -e 'console.log(JSON.stringify({node:process.version,platform:process.platform,arch:process.arch}))'
          npm --version
          node node_modules/playwright/cli.js --version
          uname -srmo

      - name: Run entire unchanged native entry in the declared execution context
        env:
          TMPDIR: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'PAN597_EXECUTION_MODE=%s\n' "$PAN597_EXECUTION_MODE"
          sha256sum scripts/verify-secure-default-proof.mjs
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          import {runProofCommand} from './scripts/verify-secure-default-proof.mjs';
          const samplePath=join(process.env.RUNNER_TEMP,'pan597-resource-sample.mjs');
          writeFileSync(samplePath,"import{readdirSync,readFileSync}from'node:fs';import{loadavg,freemem,totalmem}from'node:os';const names=['node','chrome','chromium','postgres','Xvfb','certutil'],counts=Object.fromEntries(names.map(n=>[n,0]));for(const pid of readdirSync('/proc')){if(!/^[0-9]+$/.test(pid))continue;try{const name=readFileSync('/proc/'+pid+'/comm','utf8').trim();if(names.includes(name))counts[name]++;}catch{}}console.log('PAN597_RESOURCE_SAMPLE '+JSON.stringify({timeMs:Date.now(),loadavg:loadavg(),freeBytes:freemem(),totalBytes:totalmem(),processNameCounts:counts}));",{flag:'wx'});
          const sample=JSON.stringify(process.execPath)+' '+JSON.stringify(samplePath);
          const mode=process.env.PAN597_EXECUTION_MODE;
          if(mode==='proof-child'){
            await runProofCommand(sample+' && npm run pan597:test',process.cwd());
          }else if(mode==='late-native-warm'){
            const commands=JSON.parse(readFileSync('package.json','utf8')).scripts.pretest.split(' && ');
            const first=commands.indexOf('npm run pan565:test'),last=commands.indexOf('npm run pan597:test');
            if(first<0||last<=first||last-first!==8)throw Error('DIAGNOSTIC_PREFIX_IDENTITY_DENIED');
            const prefix=commands.slice(first,last);
            console.log('DIAGNOSTIC_PREDECESSOR_PREFIX '+JSON.stringify(prefix));
            const chain=['npm run build --silent',sample,...prefix.flatMap(command=>[command,sample]),'npm run pan597:test'];
            await runProofCommand(chain.join(' && '),process.cwd());
          }else{throw Error('DIAGNOSTIC_MODE_DENIED');}
          JS

      - name: Stage bounded PAN597 case evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/pan597-selected-case-evidence"
          mkdir -p "$output"
          for directory in "${RUNNER_TEMP}"/pan597-browser-evidence-*; do
            test -d "$directory" && ! test -L "$directory" || continue
            destination="$output/${directory##*/}"
            for name in 606-authority.json 606-keyboard-bottom.json 606-source-raster.json 606-receiver-raster.json 606-grant-freshness.json 606-short-lease-stalled-sse.json 606-stale-read-ordering.json jo259457-native-display-source.png jo259457-native-display-restricted-receiver-390.png jo259457-native-display-restricted-receiver-390-bottom.png; do
              if test -f "$directory/$name" && ! test -L "$directory/$name"; then
                mkdir -p "$destination"
                cp -- "$directory/$name" "$destination/$name"
              fi
            done
          done

      - name: Retain only bounded synthetic case evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pan597-diagnostic-${{ github.sha }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/pan597-selected-case-evidence
          if-no-files-found: warn
          retention-days: 7

      - name: Verify unchanged payload after diagnostic execution
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$PAN597_PAYLOAD_SHA"
          git diff --exit-code
