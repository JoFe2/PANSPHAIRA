name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, test and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Set up supported npm version
        run: npm install --global npm@11.16.0

      - name: Set up supported Docker Compose
        env:
          CM_COMPOSE_URL: https://github.com/docker/compose/releases/download/v2.40.3/docker-compose-linux-x86_64
          CM_COMPOSE_SHA256: dba9d98e1ba5bfe11d88c99b9bd32fc4a0624a30fafe68eea34d61a3e42fd372
        run: |
          compose_root="$RUNNER_TEMP/chimpmaera-docker-config"
          plugin_dir="$compose_root/cli-plugins"
          compose_binary="$plugin_dir/docker-compose"
          mkdir -p "$plugin_dir"
          curl --fail --location --silent --show-error \
            --output "$compose_binary" "$CM_COMPOSE_URL"
          printf '%s  %s\n' "$CM_COMPOSE_SHA256" "$compose_binary" \
            | sha256sum --check -
          chmod 0755 "$compose_binary"
          printf 'DOCKER_CONFIG=%s\n' "$compose_root" >> "$GITHUB_ENV"
          DOCKER_CONFIG="$compose_root" docker compose version

      - name: Verify release-tree checksums
        run: sha256sum --check SHA256SUMS

      - name: Verify fail-closed release governance
        run: |
          npm run release-governance:verify
          npm run release-governance:test

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Verify supply-chain declarations
        run: npm run supply-chain:verify

      - name: Run SAFE_GUIDED secure-default proof
        run: npm run proof:secure-default

      - name: Run project tests
        run: npm test

      - name: Verify external video service boundary
        run: npm run external-video-service:test

      - name: Confirm tests did not modify tracked files
        run: git diff --exit-code
